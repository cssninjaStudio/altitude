networks:
  cssninja-services:
    external: true

services:
  altitude-demo:
    image: digisquad/cssninja.altitude-demo:latest
    networks:
      - cssninja-services
    restart: 'unless-stopped'
    labels:
      traefik.enable: true
      traefik.docker.network: 'cssninja-services'
      traefik.http.routers.altitude-demo.entrypoints: 'http'
      traefik.http.routers.altitude-demo.rule: 'Host(`altitude.${HOST:-127.0.0.1.nip.io}`)'
      traefik.http.routers.altitude-demo.middlewares: 'https-redirect@file'
      traefik.http.services.altitude-demo-https.loadbalancer.server.port: 8080
      traefik.http.routers.altitude-demo-https.rule: 'Host(`altitude.${HOST:-127.0.0.1.nip.io}`)'
      traefik.http.routers.altitude-demo-https.tls: true
      traefik.http.routers.altitude-demo-https.entrypoints: 'https'
      traefik.http.routers.altitude-demo-https.tls.certresolver: 'http'

